<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Loulou OS</title>
<style>
:root{--deep:#0c2146;--blue:#1d4f9f;--coral:#ff7a59;--bou:#e0457b;--sand:#f6ecdc}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--deep);color:#fff;font:15px/1.4 "Segoe UI",system-ui,-apple-system,sans-serif}
.L{position:fixed;inset:0;transition:opacity .9s,visibility .9s}
.off{opacity:0;visibility:hidden}
button{font:inherit;cursor:pointer}
#intro{display:grid;place-items:center;align-content:center;background:var(--sand);color:var(--deep);text-align:center}
#intro svg{width:min(52vw,230px)}
#hp{fill:none;stroke:var(--bou);stroke-width:2.6;stroke-linecap:round;stroke-dasharray:420;stroke-dashoffset:420;animation:dr 2.6s .3s forwards ease-in-out,fi 1s 3s forwards}
@keyframes dr{to{stroke-dashoffset:0}}@keyframes fi{to{fill:var(--bou)}}
#it{margin-top:18px;font:italic 20px Georgia,serif;min-height:30px}
.wp{position:absolute;inset:0;background:radial-gradient(circle at 68% 60%,#ffd9a8 0 6%,#ffb27a 6.5% 9%,transparent 9.5%),linear-gradient(#1b2f6b 0%,#a8508a 52%,#ff9a6b 70%,#1d4f9f 70.2%,#0c2146 100%);transition:background .6s}
.wp::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.22),rgba(0,0,0,.03) 35%,rgba(0,0,0,.3))}
.wp svg{position:absolute;bottom:0;width:100%;height:58%}.wp.cu svg{display:none}
#lock{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center}
#lt{font-size:clamp(64px,16vw,120px);font-weight:200;line-height:1;position:relative;text-shadow:0 2px 20px #0006}
#ld{position:relative;opacity:.9;margin-bottom:26px}
.av{position:relative;width:76px;height:76px;border-radius:50%;background:linear-gradient(135deg,var(--bou),var(--coral));display:grid;place-items:center;font-size:32px;font-weight:600;cursor:pointer}
#pw{position:relative;background:rgba(255,255,255,.2);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.35);border-radius:22px;padding:9px 18px;color:#fff;font-size:16px;text-align:center;outline:none;width:200px;letter-spacing:3px}
#pw::placeholder{letter-spacing:0;color:#ffffffaa}
#lh{position:relative;font-size:13px;min-height:20px;text-shadow:0 1px 6px #0008}
.shk{animation:sh .35s}@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
#bar{position:absolute;top:0;left:0;right:0;height:30px;display:flex;align-items:center;gap:14px;padding:0 14px;background:rgba(10,20,50,.4);backdrop-filter:blur(16px);font-size:13px;z-index:5000}
#bar b{font-weight:700}#bar .r{margin-left:auto;display:flex;gap:12px;align-items:center}
#dock{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:10px;padding:8px 12px;background:rgba(255,255,255,.18);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.28);border-radius:22px;z-index:5000}
.dk{width:54px;height:54px;border-radius:14px;display:grid;place-items:center;position:relative;cursor:pointer;transition:transform .15s}
.dk:hover{transform:translateY(-8px) scale(1.12)}.dk svg{width:28px;height:28px}
.dk.run::after{content:"";position:absolute;bottom:-6px;width:5px;height:5px;border-radius:50%;background:#fff}
.stk{position:absolute;top:50px;right:22px;width:190px;padding:14px;background:#ffe27a;color:#4a3b00;font:16px/1.4 "Segoe Print","Bradley Hand",cursive;transform:rotate(2.5deg);box-shadow:0 8px 20px #0005}
.win{position:absolute;background:#fbf7f0;color:#1a2238;border-radius:12px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 50px #0007,0 0 0 1px #0002;animation:op .22s}
@keyframes op{from{transform:scale(.9);opacity:0}}
.wh{display:flex;align-items:center;gap:8px;padding:0 12px;height:38px;background:#e9e2d6;cursor:grab;touch-action:none;user-select:none;font-size:13px;font-weight:600;flex:none}
.wh span{margin:0 auto;transform:translateX(-30px);white-space:nowrap}
.c{width:15px;height:15px;border-radius:50%;cursor:pointer;display:grid;place-items:center;font-style:normal;font-size:11px;line-height:1;color:transparent;font-weight:700}
.wh:hover .c{color:#0009}.r{background:#ff5f57}.y{background:#febc2e}.g{background:#28c840}
@media(hover:none){.c{color:#0009;width:22px;height:22px;font-size:15px}}
.wb{flex:1;overflow:auto;min-height:0;padding:14px}
.rz{position:absolute;right:0;bottom:0;width:24px;height:24px;cursor:nwse-resize;touch-action:none;background:linear-gradient(135deg,transparent 50%,#0005 50%,#0005 58%,transparent 58%,transparent 72%,#0005 72%,#0005 80%,transparent 80%)}
.win.max{inset:30px 0 92px 0!important;width:auto!important;height:auto!important;border-radius:0}.win.max .rz{display:none}
.tm{background:#0e1424;color:#9be8c4;font:13.5px/1.45 ui-monospace,Consolas,monospace}
.tm pre{white-space:pre-wrap;word-break:break-word;margin:0}
.tm input{background:none;border:0;outline:none;color:#ffd27a;font:inherit;width:75%}
.fl{display:flex;height:100%;margin:-14px}
.fs{width:130px;background:#efe8dc;padding:10px;display:flex;flex-direction:column;gap:4px;font-size:14px}
.fs div,.fm div{padding:6px 10px;border-radius:7px;cursor:pointer}.fs div:hover,.fm div:hover,.fs .on{background:#d9cfbd}
.fm{flex:1;padding:10px}
.bt{background:var(--blue);color:#fff;border:0;border-radius:8px;padding:7px 13px;margin:2px;font-size:14px}
.bt.on{background:var(--bou)}
canvas{display:block;width:100%;border-radius:8px;background:#0c1630}
.cm{display:flex;flex-direction:column;height:100%;background:#000}
.cm .tb{background:#e9e2d6;padding:4px;display:flex;flex-wrap:wrap;align-items:center;gap:2px}
.cm canvas{flex:1;min-height:0;object-fit:contain;border-radius:0}
#kt{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;max-width:330px;margin:10px auto}
#kt div{aspect-ratio:1;border-radius:8px;display:grid;place-items:center;font-weight:700;cursor:pointer}
#cb{display:grid;grid-template-columns:repeat(8,1fr);width:min(100%,420px);margin:0 auto;aspect-ratio:1;border-radius:6px;overflow:hidden;box-shadow:0 0 0 3px #1d4f9f}
#cb div{display:grid;place-items:center;font-size:clamp(20px,6vw,38px);font-family:"Segoe UI Symbol","Noto Sans Symbols 2",serif;cursor:pointer;position:relative;user-select:none}
#cb .l{background:#f3e9d6}#cb .d{background:#6d92c9}
#cb .w{color:#fff;-webkit-text-stroke:1px #0c2146}#cb .k{color:#0c2146}
#cb .sel{box-shadow:inset 0 0 0 4px #e0457b}#cb .mv::after{content:"";position:absolute;width:30%;height:30%;border-radius:50%;background:#e0457b88}
#cb .lm{background:#ffd27a!important}#cb .ht{box-shadow:inset 0 0 0 4px #28c840}
.ly{text-align:center;min-height:84px;margin-top:8px}
.ly .ar{font-size:27px;font-family:"Segoe UI","Noto Naskh Arabic",Tahoma,serif;line-height:1.6;direction:rtl}
.ly .ar span{opacity:.45;transition:.2s}.ly .ar .on{opacity:1;color:#e0457b}.ly .tr{font-size:13px;opacity:.65}
.wg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.wg div{aspect-ratio:16/10;border-radius:8px;background:#ccc center/cover;cursor:pointer}
.wb input[type=text]{width:100%;padding:7px 10px;border:1px solid #bbb;border-radius:8px;margin:4px 0;font:inherit}
.gt{border-radius:14px;padding:14px;color:#fff;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-height:112px}.gt svg{width:30px;height:30px}.gt b{font-size:16px}.gt span{font-size:12.5px;opacity:.92}
#c4{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;background:#1d4f9f;padding:8px;border-radius:12px;max-width:420px;margin:10px auto}
#c4 div{aspect-ratio:1;border-radius:50%;background:#f6ecdc;cursor:pointer;transition:background .25s}#c4 .p1{background:#ff7a59}#c4 .p2{background:#ffd27a}#c4 .wn{box-shadow:0 0 0 4px #fff}
.gb{height:8px;border-radius:4px;background:#e0457b;margin:2px 0}
#tq{position:absolute;top:42px;right:14px;display:flex;flex-direction:column;gap:8px;z-index:6000;width:min(300px,calc(100% - 28px))}
.tq{background:rgba(250,246,238,.94);color:#1a2238;border-radius:14px;padding:10px 14px;font-size:13px;box-shadow:0 10px 30px #0006;animation:tin .4s}
.tq b{display:block}@keyframes tin{from{transform:translateX(120%)}}
@media(max-width:700px){.win{inset:30px 0 66px 0!important;width:auto!important;height:auto!important;border-radius:0}.rz{display:none}.dk{width:40px;height:40px}.dk svg{width:23px;height:23px}#dock{gap:5px;padding:6px 8px}.stk{display:none}.fs{width:96px}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
</style>
</head>
<body>
<div id="intro" class="L"><svg viewBox="0 0 120 120"><path id="hp" d="M60 100C10 65 12 25 40 25C52 25 58 33 60 40C62 33 68 25 80 25C108 25 110 65 60 100Z"/></svg><div id="it"></div></div>
<div id="lock" class="L off"><div class="wp"></div><div id="lt"></div><div id="ld"></div><div class="av" id="av"></div>
  <input id="pw" type="password" placeholder="password" autocomplete="off" inputmode="numeric"><div id="lh"></div></div>
<div id="desk" class="L off"><div class="wp"></div>
  <div id="bar"><b>Loulou OS</b><span id="an">Finder</span><div class="r"><span>Tunis &rarr; Morocco</span><span id="ck"></span></div></div>
  <div class="stk">to do<br>- survive exams<br>- open the camera<br>- stop pretending chess is boring</div>
  <div id="tq"></div><div id="dock"></div></div>

<script>
/* ===== edit these ===== */
const CFG={
  her:"Ella",                 // her name
  pass:"malik",                // password she has to guess
  hint:"the day we met. day + month.",
  songs:[]                    // your own songs: [{n:"Name",u:"songs/a.mp3",lrc:"songs/a.lrc"}]  (lrc = lyrics file, optional)
};
/* ====================== */
const $=s=>document.querySelector(s),sleep=ms=>new Promise(r=>setTimeout(r,ms));
const loadJS=s=>new Promise((a,r)=>{const e=document.createElement('script');e.src=s;e.onload=a;e.onerror=r;document.head.appendChild(e)});
const D=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const HOUSES=`<svg viewBox="0 0 800 300" preserveAspectRatio="xMidYMax slice"><g fill="#f4efe6"><rect x="0" y="170" width="120" height="130"/><rect x="100" y="120" width="90" height="180"/><rect x="170" y="195" width="110" height="105"/><rect x="560" y="150" width="100" height="150"/><rect x="640" y="205" width="160" height="95"/></g><g fill="#1d4f9f"><path d="M30 300v-50a15 15 0 0 1 30 0v50z"/><path d="M125 300v-60a15 15 0 0 1 30 0v60z"/><path d="M590 300v-60a15 15 0 0 1 30 0v60z"/><path d="M690 300v-45a15 15 0 0 1 30 0v45z"/></g><path d="M0 300v-28q200-25 400 12t400-22v38z" fill="#0c2146"/></svg>`;
document.querySelectorAll('.wp').forEach(w=>w.insertAdjacentHTML('afterbegin',HOUSES));

/* ---------- wallpaper ---------- */
function setWP(w,save=true){
  const apply=(css,cu)=>document.querySelectorAll('.wp').forEach(e=>{e.style.background=css;e.classList.toggle('cu',cu)});
  if(w.t==='img'){const im=new Image();im.onload=()=>apply(`center/cover url("${w.u}")`,1);im.onerror=()=>toast('Wallpaper','could not load that image.');im.src=w.u}
  else if(w.t==='css')apply(w.c,1);else apply('',0);
  if(save&&w.t!=='blob')try{localStorage.setItem('wp',JSON.stringify(w))}catch(e){}
}
const rnd=()=>Math.random().toString(36).slice(2,8);
const pic=(s,w=1920,h=1080)=>`https://picsum.photos/seed/${s}/${w}/${h}`;
(function(){let w;try{w=JSON.parse(localStorage.getItem('wp'))}catch(e){}setWP(w||{t:'img',u:pic(rnd())},false)})();

/* ---------- intro + lock ---------- */
(async()=>{await sleep(3300);for(const c of "made by hand, for you."){$('#it').textContent+=c;await sleep(75)}await sleep(1600);
  $('#intro').classList.add('off');$('#lock').classList.remove('off');$('#pw').focus()})();
$('#av').textContent=CFG.her[0].toUpperCase();
(function tick(){const d=new Date();$('#lt').textContent=d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  $('#ld').textContent=d.toLocaleDateString([],{weekday:'long',day:'numeric',month:'long'});$('#ck').textContent=$('#lt').textContent;setTimeout(tick,5000)})();
let tries=0;
$('#av').onclick=()=>$('#lh').textContent='hint: '+CFG.hint;
$('#lh').textContent='hi '+CFG.her+'. you know the password. i think.';
$('#pw').onkeydown=e=>{if(e.key!=='Enter')return;const p=$('#pw');
  if(p.value.replace(/\W/g,'').toLowerCase()===String(CFG.pass).toLowerCase())unlock();
  else{p.classList.remove('shk');void p.offsetWidth;p.classList.add('shk');p.value='';tries++;$('#lh').textContent=tries>=2?'hint: '+CFG.hint:'nope. try again, '+CFG.her+'.'}};

/* ---------- audio ---------- */
let AC,master,anl,cur=null;
function audio(){
  if(AC){AC.resume();return}
  AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.8;anl=AC.createAnalyser();anl.fftSize=256;
  const cv=AC.createConvolver(),L=AC.sampleRate*2.2,ir=AC.createBuffer(2,L,AC.sampleRate);
  for(let c=0;c<2;c++){const d=ir.getChannelData(c);for(let i=0;i<L;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/L,3)}
  cv.buffer=ir;const w=AC.createGain();w.gain.value=.4;master.connect(anl);anl.connect(AC.destination);master.connect(cv);cv.connect(w);w.connect(anl);
}
function nt(bus,m,t,d,type='triangle',v=.2){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=440*2**((m-69)/12);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(bus);o.start(t);o.stop(t+d+.05)}
/* original melodies + original lyrics (written for this gift) */
const TR=[
 {n:"Layali",root:62,bpm:84,arp:[0,7,12,7],bii:1,
  mel:[[12,1],[10,.5],[8,.5],[7,1],[8,.5],[7,.5],[4,1],[5,1],[4,.5],[1,.5],[0,2],[4,1],[5,.5],[7,.5],[8,1],[10,1],[8,.5],[7,.5],[5,1],[4,.5],[1,.5],[0,2]],
  lines:[{ar:"يا بعيدة عني وقلبي معاك",tr:"ya b3ida 3anni w9albi m3ak",n:11},{ar:"صوتك دوا وضحكتك سلام",tr:"sawtek dawa w dhe7ketek salem",n:11}]},
 {n:"Sidi Bou",root:62,bpm:72,arp:[0,4,7,12],bii:0,
  mel:[[7,1],[9,1],[12,2],[9,1],[7,1],[4,2],[2,1],[4,1],[7,2],[4,1],[2,1],[0,2]],
  lines:[{ar:"تونس وطني وإنتي دارنا",tr:"tounes watani w enti darna",n:6},{ar:"نغنيلك لين تضحكي",tr:"nghannilek lin tdhe7ki",n:6}]},
 {n:"Ya Doctora",root:60,bpm:100,arp:[0,4,7,4],bii:0,
  mel:[[0,1],[4,1],[5,1],[7,2],[8,1],[7,1],[5,1],[4,1],[1,1],[4,1],[5,1],[0,3]],
  lines:[{ar:"يا دكتورة يا غالية",tr:"ya doctora ya ghalya",n:6},{ar:"وصفة حبي ما تخلصش",tr:"wasfet 7obbi ma tkhallesh",n:6}]}
];
TR.forEach(t=>{let s=0;t.nt=t.mel.map(([o,d])=>{const x={m:t.root+o,s:s*60/t.bpm,d:d*60/t.bpm};s+=d;return x});t.beats=s;t.len=s*60/t.bpm});
function stop(){if(!cur)return;clearTimeout(cur.timer);cur.b.gain.setTargetAtTime(0,AC.currentTime,.08);cur.el&&cur.el.pause();cur=null}
async function play(tr){
  audio();stop();const b=AC.createGain();b.connect(master);cur={tr,b,base:AC.currentTime+.15};
  if(tr.u){const el=new Audio(tr.u);AC.createMediaElementSource(el).connect(b);el.play();cur.el=el;
    if(tr.lrc)try{const t=await(await fetch(tr.lrc)).text();cur.lrc=t.split('\n').map(l=>l.match(/\[(\d+):(\d+(?:\.\d+)?)\](.*)/)).filter(Boolean).map(m=>({t:+m[1]*60+ +m[2],s:m[3].trim()}))}catch(e){}return}
  let t0=cur.base;
  (function sched(){if(!cur||cur.tr!==tr)return;const bt=60/tr.bpm;
    tr.nt.forEach(n=>nt(b,n.m,t0+n.s,n.d*1.1+.4,'triangle',.22));
    for(let i=0;i<tr.beats*2;i++){const bi=Math.floor(i/2)%9,off=tr.bii&&bi>=6&&bi<8?tr.bii:0;nt(b,tr.root-12+off+tr.arp[i%4],t0+i*bt/2,.7,'sine',.12)}
    nt(b,tr.root-24,t0,bt*4,'sine',.2);nt(b,tr.root-24,t0+tr.len/2,bt*4,'sine',.2);
    t0+=tr.len;cur.timer=setTimeout(sched,(t0-AC.currentTime-1)*1000)})();
}
function chime(){audio();[74,78,81,86].forEach((m,i)=>nt(master,m,AC.currentTime+i*.13,1.6,'sine',.18))}
function pitch(buf,sr){let r=0;for(const x of buf)r+=x*x;if(Math.sqrt(r/buf.length)<.015)return -1;
  const a=Math.floor(sr/1000),z=Math.floor(sr/80),c=new Float32Array(z);let mx=0;
  for(let l=a;l<z;l++){let s=0;for(let i=0;i<buf.length-z;i++)s+=buf[i]*buf[i+l];c[l]=s;if(s>mx)mx=s}
  for(let l=a;l<z;l++)if(c[l]>=mx*.9)return sr/l;return -1}

/* ---------- window manager ---------- */
let z=10,k=0;
const I=p=>`<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
function win(id,title,w,h,build){
  const ex=document.getElementById('w_'+id);if(ex){ex.style.display='';ex.style.zIndex=++z;return}
  const el=document.createElement('div');el.className='win';el.id='w_'+id;
  const hh=Math.min(h,innerHeight-140);el.style.cssText=`width:${Math.min(w,innerWidth-16)}px;height:${hh}px;left:${Math.max(8,(innerWidth-w)/2+(k%4)*30-60)}px;top:${Math.min(46+(k++%4)*24,Math.max(36,innerHeight-100-hh))}px;z-index:${++z}`;
  el.innerHTML=`<div class="wh"><i class="c r">&times;</i><i class="c y">&minus;</i><i class="c g">+</i><span>${title}</span></div><div class="wb"></div><div class="rz"></div>`;
  $('#desk').appendChild(el);const body=el.querySelector('.wb'),clean=build(body)||(()=>{});
  const dk=document.getElementById('d_'+id);dk&&dk.classList.add('run');$('#an').textContent=title;
  const q=s=>el.querySelector(s);
  q('.r').onclick=()=>{clean();el.remove();dk&&dk.classList.remove('run');$('#an').textContent='Finder'};
  q('.y').onclick=()=>el.style.display='none';
  const mx=()=>el.classList.toggle('max');q('.g').onclick=mx;q('.wh').ondblclick=e=>{if(!e.target.classList.contains('c'))mx()};
  el.onpointerdown=()=>{el.style.zIndex=++z;$('#an').textContent=title};
  const hd=q('.wh');let dx,dy,on=false;
  hd.onpointerdown=e=>{if(e.target.classList.contains('c')||el.classList.contains('max'))return;on=true;dx=e.clientX-el.offsetLeft;dy=e.clientY-el.offsetTop;hd.setPointerCapture(e.pointerId)};
  hd.onpointermove=e=>{if(on){el.style.left=e.clientX-dx+'px';el.style.top=Math.min(Math.max(30,e.clientY-dy),Math.max(30,innerHeight-100-el.offsetHeight))+'px'}};hd.onpointerup=()=>on=false;
  const rz=q('.rz');let rw,rh,rx,ry,rs=false;
  rz.onpointerdown=e=>{rs=true;rw=el.offsetWidth;rh=el.offsetHeight;rx=e.clientX;ry=e.clientY;rz.setPointerCapture(e.pointerId);e.stopPropagation()};
  rz.onpointermove=e=>{if(rs){el.style.width=Math.max(300,rw+e.clientX-rx)+'px';el.style.height=Math.min(Math.max(220,rh+e.clientY-ry),innerHeight-100-el.offsetTop)+'px'}};rz.onpointerup=()=>rs=false;
}
function toast(t,x){const d=document.createElement('div');d.className='tq';d.innerHTML=`<b>${t}</b>${x}`;$('#tq').appendChild(d);setTimeout(()=>d.remove(),7000)}
const APPS={
  files:{n:'Files',bg:'linear-gradient(#4aa3e8,#2a6fc4)',i:I('<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>'),w:520,h:360,f:filesApp},
  term:{n:'Terminal',bg:'linear-gradient(#3a4256,#161b2b)',i:I('<path d="M5 7l5 5-5 5M12 18h7"/>'),w:480,h:360,f:termApp},
  face:{n:'Camera',bg:'linear-gradient(#ff8f6b,#e0457b)',i:I('<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>'),w:620,h:560,f:camApp},
  studio:{n:'Studio',bg:'linear-gradient(#8b6df0,#4a3bb5)',i:I('<path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/>'),w:580,h:560,f:studioApp},

  const lines=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  const winner=x=>{for(const l of lines)if(x[l[0]]&&x[l[0]]===x[l[1]]&&x[l[1]]===x[l[2]])return x[l[0]];return x.every(Boolean)?'draw':null};
  function score(x,depth,maximizing){const w=winner(x);if(w==='O')return 10-depth;if(w==='X')return depth-10;if(w==='draw')return 0;let best=maximizing?-Infinity:Infinity;for(let i=0;i<9;i++)if(!x[i]){x[i]=maximizing?'O':'X';const v=score(x,depth+1,!maximizing);x[i]='';best=maximizing?Math.max(best,v):Math.min(best,v)}return best}
  function ai(){let best=-Infinity,move=-1;for(let i=0;i<9;i++)if(!a[i]){a[i]='O';const v=score(a,0,false);a[i]='';if(v>best){best=v;move=i}}return move}

  b.querySelector('#aiStart').onclick=()=>{humanFirst=false;b.querySelector('#aiStart').classList.add('on');b.querySelector('#human').classList.remove('on');reset()};

  const wn=()=>W.find(w=>bd[w[0]]&&w.every(i=>bd[i]==bd[w[0]]));

}

/* ---------- virus chase (BFS ghosts) ---------- */
function virusApp(b){
  const CW=15,CH=13,S=28,TK=170,DIRS=[[1,0],[-1,0],[0,1],[0,-1]];
  b.innerHTML=`<div style="text-align:center"><canvas id="vc" width="${CW*S}" height="${CH*S}" style="max-width:100%;margin:0 auto;touch-action:none"></canvas><div id="vm" style="font-size:14px;margin:6px 0;min-height:22px">arrows, WASD or swipe to move. eat all the pills. the big ones make viruses scared.</div><button class="bt" id="vs" style="background:#e0457b">Start</button>
  <div style="display:grid;grid-template-columns:repeat(3,64px);gap:4px;justify-content:center;margin-top:6px"><span></span><button class="bt" data-d="0,-1">up</button><span></span><button class="bt" data-d="-1,0">left</button><button class="bt" data-d="0,1">down</button><button class="bt" data-d="1,0">right</button></div></div>`;
  const cv=b.querySelector('#vc'),g=cv.getContext('2d'),vm=b.querySelector('#vm');let st,alive=true,lastT=0,run=false;
  const wall=(x,y)=>x<0||y<0||x>=CW||y>=CH||st.m[y][x]=='#';
  function init(){st={m:[],pills:0,score:0,lives:3,scare:0,
    pl:{x:7,y:7,px:7,py:7,dx:0,dy:0,nx:0,ny:0},vs:[[7,1],[7,11],[1,5],[13,5]].map(([x,y],i)=>({x,y,px:x,py:y,i,sx:x,sy:y,w:i*4}))};
    for(let y=0;y<CH;y++){st.m.push([]);for(let x=0;x<CW;x++){let c=(x==0||y==0||x==CW-1||y==CH-1||(x%2==0&&y%2==0))?'#':'.';
      if((x==1||x==13)&&(y==1||y==11))c='o';if((x==7&&y==7))c=' ';st.m[y].push(c);if(c=='.'||c=='o')st.pills++}}}
  function bfs(sx,sy,tx,ty){const k=(x,y)=>y*CW+x,pr={};pr[k(sx,sy)]=-1;const q=[[sx,sy]];
    while(q.length){const[x,y]=q.shift();if(x==tx&&y==ty)break;for(const[dx,dy]of DIRS){const nx=x+dx,ny=y+dy;if(!wall(nx,ny)&&pr[k(nx,ny)]===undefined){pr[k(nx,ny)]=k(x,y);q.push([nx,ny])}}}
    let c=k(tx,ty);if(pr[c]===undefined)return[0,0];while(pr[c]!==k(sx,sy)&&pr[c]!==-1)c=pr[c];return[c%CW-sx,(c/CW|0)-sy]}
  function step(){if(!run)return;const p=st.pl;p.px=p.x;p.py=p.y;
    if(!wall(p.x+p.nx,p.y+p.ny)&&(p.nx||p.ny)){p.dx=p.nx;p.dy=p.ny}
    if(!wall(p.x+p.dx,p.y+p.dy)){p.x+=p.dx;p.y+=p.dy}
    const c=st.m[p.y][p.x];if(c=='.'){st.score+=10;st.pills--}else if(c=='o'){st.score+=50;st.pills--;st.scare=40}st.m[p.y][p.x]=' ';
    if(st.scare>0)st.scare--;
    st.vs.forEach(v=>{v.px=v.x;v.py=v.y;if(v.w>0){v.w--;return}if(st.scare==0&&Math.random()<.18)return;
      let d;if(st.scare>0){let bd=-1;for(const[dx,dy]of DIRS){if(wall(v.x+dx,v.y+dy))continue;const dd=Math.abs(v.x+dx-p.x)+Math.abs(v.y+dy-p.y)+Math.random();if(dd>bd){bd=dd;d=[dx,dy]}}}
      else{let tx=p.x,ty=p.y;const dist=Math.abs(v.x-p.x)+Math.abs(v.y-p.y);
        if(v.i==1){const ax=p.x+p.dx*4,ay=p.y+p.dy*4;if(!wall(ax,ay)){tx=ax;ty=ay}}
        if(v.i==2&&Math.random()<.4){tx=1+(Math.random()*13|0);ty=1+(Math.random()*11|0);if(wall(tx,ty)){tx=p.x;ty=p.y}}
        if(v.i==3&&dist<6){tx=1;ty=11}
        d=bfs(v.x,v.y,tx,ty)}
      if(d){v.x+=d[0];v.y+=d[1]}});
    st.vs.forEach(v=>{if((v.x==p.x&&v.y==p.y)||(v.x==p.px&&v.y==p.py&&v.px==p.x&&v.py==p.y)){
      if(st.scare>0){st.score+=200;v.x=v.px=v.sx;v.y=v.py=v.sy;v.w=12}
      else{st.lives--;st.vs.forEach(u=>{u.x=u.px=u.sx;u.y=u.py=u.sy;u.w=u.i*4});p.x=p.px=7;p.y=p.py=7;p.dx=p.dy=p.nx=p.ny=0;
        if(st.lives<=0){run=false;vm.textContent='the viruses won. wash your hands and try again.'}}}});
    if(st.pills<=0&&run){run=false;vm.textContent='all pills collected. the pharmacy is saved.'}
    if(run)vm.textContent=`score ${st.score}   lives ${st.lives}`}
  function draw(t){if(!alive)return;requestAnimationFrame(draw);const f=Math.min(1,(performance.now()-lastT)/TK);g.fillStyle='#0c1630';g.fillRect(0,0,CW*S,CH*S);
    for(let y=0;y<CH;y++)for(let x=0;x<CW;x++){const c=st.m[y][x];if(c=='#'){g.fillStyle='#1d4f9f';g.beginPath();g.roundRect(x*S+2,y*S+2,S-4,S-4,7);g.fill()}
      else if(c=='.'){g.fillStyle='#f6ecdc';g.beginPath();g.roundRect(x*S+S/2-4,y*S+S/2-2,8,4,2);g.fill()}
      else if(c=='o'){g.fillStyle='#ffd27a';g.beginPath();g.arc(x*S+S/2,y*S+S/2,6+Math.sin(t/150)*1.5,0,7);g.fill()}}
    const lp=(a,c)=>a+(c-a)*(run?f:1),p=st.pl,px=lp(p.px,p.x)*S+S/2,py=lp(p.py,p.y)*S+S/2,ang=Math.atan2(p.dy||0,p.dx||1),mo=.15+Math.abs(Math.sin(t/110))*.45;
    g.fillStyle='#ff7a59';g.beginPath();g.moveTo(px,py);g.arc(px,py,S*.42,ang+mo,ang+Math.PI*2-mo);g.fill();
    st.vs.forEach(v=>{const x=lp(v.px,v.x)*S+S/2,y=lp(v.py,v.y)*S+S/2,sc=st.scare>0,bl=sc&&st.scare<12&&Math.floor(t/150)%2;
      g.strokeStyle=g.fillStyle=sc?(bl?'#fff':'#7fb4ff'):'#6bd36b';g.lineWidth=3;for(let a=0;a<8;a++){g.beginPath();g.moveTo(x+Math.cos(a*.785)*S*.3,y+Math.sin(a*.785)*S*.3);g.lineTo(x+Math.cos(a*.785)*S*.46,y+Math.sin(a*.785)*S*.46);g.stroke()}
      g.beginPath();g.arc(x,y,S*.32,0,7);g.fill();g.fillStyle='#0c1630';g.beginPath();g.arc(x-4,y-2,3,0,7);g.arc(x+4,y-2,3,0,7);g.fill()})}
  const setD=(dx,dy)=>{st.pl.nx=dx;st.pl.ny=dy};
  const kd=e=>{if(document.activeElement.tagName=='INPUT')return;const m={ArrowUp:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1],ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0]}[e.key];if(m){setD(...m);e.preventDefault()}};
  document.addEventListener('keydown',kd);
  b.querySelectorAll('[data-d]').forEach(x=>x.onclick=()=>setD(...x.dataset.d.split(',').map(Number)));
  let sx,sy;cv.onpointerdown=e=>{sx=e.clientX;sy=e.clientY};cv.onpointerup=e=>{const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<20)return;Math.abs(dx)>Math.abs(dy)?setD(Math.sign(dx),0):setD(0,Math.sign(dy))};
  b.querySelector('#vs').onclick=e=>{init();run=true;lastT=performance.now();e.target.textContent='Restart'};
  init();const iv=setInterval(()=>{lastT=performance.now();step()},TK);requestAnimationFrame(draw);
  return()=>{alive=false;clearInterval(iv);document.removeEventListener('keydown',kd)};
}

/* ---------- doodle duel (DoodleNet neural network in the browser) ---------- */
function doodleApp(b){

    <div style="display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap">

    </div>
    <p style="font-size:13px;color:#555;margin:4px 0">Draw one big object in the middle. Release the mouse/finger to ask the AI.</p>
    <canvas id="dc" width="280" height="280" style="display:block;width:min(100%,360px);height:auto;aspect-ratio:1;margin:8px auto;background:#fff;touch-action:none;border:2px solid #1d4f9f;border-radius:10px;cursor:crosshair"></canvas>
    <div id="dg" style="font-size:14px;min-height:104px;padding:5px 2px;color:#1a2238">AI guesses will appear here.</div>
    <div style="display:flex;gap:5px;flex-wrap:wrap">
      <button class="bt" id="dn" style="background:#e0457b">New word</button>
      <button class="bt" id="df">Free draw</button>
      <button class="bt" id="dguess">Guess now</button>
      <button class="bt" id="dx">Clear</button>
    </div>
    <p id="dhelp" style="font-size:12px;color:#666;margin-top:7px">The AI needs an internet connection to load the model the first time.</p>`;
  const cv=b.querySelector('#dc'),g=cv.getContext('2d'),dp=b.querySelector('#dp'),dg=b.querySelector('#dg');
  const scoreEl=b.querySelector('#dscore'),help=b.querySelector('#dhelp');
  let clf=null,ready=false,alive=true,target=null,left=0,score=0,drawing=false,busy=false,dirty=false,pending=false,roundTimer=null;
  const norm=s=>String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
  const show=()=>{dp.textContent=!ready?'Loading DoodleNet AI…':target?`Draw: ${target} · ${left}s`:'Free draw — sketch something and let me guess';scoreEl.textContent=`Score: ${score}`};
  function clear(){
    g.fillStyle='#fff';g.fillRect(0,0,280,280);dg.textContent='AI guesses will appear here.';
    dirty=false;pending=false;
  }
  function newWord(){
    if(!ready)return;
    clear();target=WD[Math.random()*WD.length|0];left=35;
    clearInterval(roundTimer);
    roundTimer=setInterval(()=>{
      if(!alive||!target)return;
      left--;show();
      if(left<=0){const missed=target;target=null;dp.textContent=`Time! The word was “${missed}”.`;clearInterval(roundTimer)}
    },1000);
    show();
  }
  g.lineWidth=10;g.lineCap='round';g.lineJoin='round';clear();
  const point=e=>{const r=cv.getBoundingClientRect();return[
    Math.max(0,Math.min(280,(e.clientX-r.left)*280/r.width)),
    Math.max(0,Math.min(280,(e.clientY-r.top)*280/r.height))
  ]};
  cv.addEventListener('pointerdown',e=>{
    if(!ready)return;
    drawing=true;dirty=true;cv.setPointerCapture(e.pointerId);
    const [x,y]=point(e);g.beginPath();g.moveTo(x,y);g.lineTo(x+.1,y);g.strokeStyle='#000';g.stroke();
  });
  cv.addEventListener('pointermove',e=>{
    if(!drawing)return;
    const [x,y]=point(e);g.lineTo(x,y);g.stroke();
  });
  const finishStroke=()=>{if(!drawing)return;drawing=false;requestGuess()};
  cv.addEventListener('pointerup',finishStroke);
  cv.addEventListener('pointercancel',finishStroke);

  // DoodleNet is trained on centered Quick, Draw!-style sketches.
  // Crop the ink and center it on a clean white square before inference.
  function modelInput(){
    const src=g.getImageData(0,0,280,280),data=src.data;
    let minX=280,minY=280,maxX=-1,maxY=-1;
    for(let y=0;y<280;y++)for(let x=0;x<280;x++){
      const i=(y*280+x)*4;
      if(data[i]<210||data[i+1]<210||data[i+2]<210){

    minX=Math.max(0,minX-pad);minY=Math.max(0,minY-pad);
    maxX=Math.min(279,maxX+pad);maxY=Math.min(279,maxY+pad);

          </div>`;
        }).join('');
        help.textContent='Tip: draw a single object, large and centered. The AI recognizes Quick, Draw! categories, not every possible object.';
        if(target){
          const wanted=norm(target);
          const hit=top.slice(0,3).some(r=>{const label=norm(r.label);return label===wanted||label.includes(wanted)||wanted.includes(label)});
          if(hit){
            score++;scoreEl.textContent=`Score: ${score}`;
            const won=target;target=null;clearInterval(roundTimer);
            dp.textContent=`Nice! The AI recognized ${won}.`;
            setTimeout(()=>{if(alive)newWord()},1700);
          }
        }
        if(pending){pending=false;requestGuess()}
      });
    }catch(e){busy=false;help.textContent='Could not run the AI. Reload the game and check your internet connection.'}
  }
  b.querySelector('#dn').onclick=newWord;
  b.querySelector('#df').onclick=()=>{target=null;clearInterval(roundTimer);clear();show()};
  b.querySelector('#dguess').onclick=requestGuess;
  b.querySelector('#dx').onclick=()=>{clear();show()};
  loadJS('https://cdn.jsdelivr.net/npm/ml5@0.12.2/dist/ml5.min.js')
    .then(()=>{
      if(!alive)return;
      if(!window.ml5||typeof ml5.imageClassifier!=='function')throw new Error('ml5 imageClassifier unavailable');
      clf=ml5.imageClassifier('DoodleNet',()=>{
        if(!alive)return;
        ready=true;help.textContent='AI ready. Draw a picture, then release to see its top five guesses.';newWord();
      });
    })
    .catch(err=>{
      if(!alive)return;
      dp.textContent='Could not load DoodleNet AI';
      help.textContent='Internet/CDN blocked or model failed to load. Allow jsDelivr and reload the game.';
    });
  return()=>{alive=false;clearInterval(roundTimer);};
}
</script>
</body>
</html>
